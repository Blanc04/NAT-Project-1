<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/sign_up.css">
  
  </head>
  <body>
    <!-- <h1>회원가입</h1> -->

    <div class="signup-box">
      <form method="post" action="/signup">
        <!-- 이름 -->
        <div class="form-group">
          <label for="name">
            <span class="required">*</span>
            이름
          </label>

          <div class="input-area">
            <input
              type="text"
              id="name"
              name="name"
              placeholder="이름을 입력하세요"
              required
            />
        
          </div>
        </div>

        <!-- 아이디 -->
        <div class="form-group">
          <label for="login-id">
            <span class="required">*</span>
            아이디
          </label>

          <div class="input-area">
            <input
              type="text"
              id="login-id"
              name="login_id"
              placeholder="ID를 입력하세요"
              autocomplete="username"
              required
            />

          </div>

          <button type="button" class="check-button">중복 확인</button>
        </div>

        <!-- 전화번호 -->
        <div class="form-group">
          <label for="phone">
            <span class="required">*</span>
            전화번호
          </label>

          <div class="input-area">
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="전화번호를 입력하세요"
              required
            />

          </div>

          <button type="button" class="check-button">인증 요청</button>
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
          <label for="password">
            <span class="required">*</span>
            비밀번호
          </label>

          <div class="input-area">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="PW를 입력하세요"
              autocomplete="new-password"
              required
            />

          </div>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="form-group">
          <label for="password-confirm">
            <span class="required">*</span>
            비밀번호 확인
          </label>

          <div class="input-area">
            <input
              type="password"
              id="password-confirm"
              name="password_confirm"
              placeholder="PW를 입력하세요"
              autocomplete="new-password"
              required
            />
  
          </div>
        </div>

        <button type="submit" class="signup-button">회원 가입</button>
      </form>
    </div>
  </body>
</html>
