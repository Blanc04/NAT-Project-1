<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리뷰 작성 | DishInside</title>
  <link rel="stylesheet" href="/static/css/header.css">
  <link rel="stylesheet" href="/static/css/review_add.css">
  <script src="/static/js/review_add.js"></script>
</head>
<body>
  {% include 'header.html' %}

  <main class="review-write-page">
    <section class="review-write-card">
      <div class="review-write-heading">
        <a href="/review/list" class="back-link">← 리뷰 목록으로 돌아가기</a>

        <span class="review-label">REVIEW</span>
        <h1>리뷰 작성</h1>
        <p><strong>둘이 먹다 둘이 죽어도 모르는 집</strong>에서의 경험을 남겨주세요.</p>
      </div>

      <form action="#" method="post" class="review-form">
        <fieldset class="rating-field">
          <legend>별점</legend>
          <p class="field-description">이 식당은 어떠셨나요?</p>

          <div class="star-rating" aria-label="별점 선택">
            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5" title="5점">★</label>
            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4" title="4점">★</label>
            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3" title="3점">★</label>
            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2" title="2점">★</label>
            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1" title="1점">★</label>
          </div>
        </fieldset>

        <div class="form-field">
          <div class="field-heading">
            <label for="review-content">리뷰 내용</label>
            <span id="char-count">0 / 1000자</span>
          </div>

          <textarea id="review-content" name="content" placeholder="음식의 맛, 서비스, 분위기 등 방문 경험을 자유롭게 작성해 주세요." required></textarea>
        </div>

        <div class="form-field">
          <label for="review-image">사진 첨부</label>
          <p class="field-description">방문 사진이 있다면 함께 올려주세요.</p>

          <label for="review-image" class="file-upload-box">
            <span class="file-icon">＋</span>
            <strong>사진 선택</strong>
            <small>이미지 파일을 첨부할 수 있습니다.</small>
          </label>
          <input type="file" id="review-image" name="image" accept="image/*" class="file-input">
        </div>

        <div class="review-notice">
          <strong>리뷰 작성 안내</strong>
          <p>직접 방문한 경험을 바탕으로 다른 이용자에게 도움이 되는 리뷰를 작성해 주세요.</p>
        </div>

        <div class="form-actions">
          <a href="/review/list" class="cancel-button">취소</a>
          <button type="submit" class="submit-button">리뷰 등록</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <small>Provided by Team. NAT</small>
  </footer>
</body>
</html>
