
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>글쓰기 | DISH INSIDE</title>

    <link rel="stylesheet" href="/static/css/board_write.css">
    <link rel="stylesheet" href="/static/css/footer/footer.css">
</head>

<body>

<div class="write-container">

    <div class="write-header">
        <h1>글쓰기</h1>
        <p>DISH INSIDE 회원들과 자유롭게 이야기를 나눠보세요.</p>
    </div>


    <form
        action="/board/write"
        method="post"
        class="write-form"
    >

        <!-- 카테고리 -->
        <div class="form-group">

            <label for="category">
                카테고리
            </label>

            <select
                id="category"
                name="category"
                required
            >
                <option value="" disabled selected>
                    카테고리를 선택해주세요.
                </option>

                <option value="자유">
                    자유
                </option>

                <option value="일상공유">
                    일상공유
                </option>

                <option value="맛집공유">
                    맛집공유
                </option>
            </select>

        </div>


        <!-- 제목 -->
        <div class="form-group">

            <label for="title">
                제목
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="제목을 입력해주세요."
                maxlength="100"
                required
            >

        </div>


        <!-- 내용 -->
        <div class="form-group">

            <label for="content">
                내용
            </label>

            <textarea
                id="content"
                name="content"
                placeholder="내용을 입력해주세요."
                required
            ></textarea>

        </div>


        <!-- 버튼 -->
        <div class="button-area">

            <a href="/board" class="cancel-btn">
                취소
            </a>

            <button
                type="submit"
                class="submit-btn"
            >
                등록
            </button>

        </div>

    </form>

</div>


{% include 'footer.html' %}
</body>
</html>
