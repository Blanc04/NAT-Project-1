<!DOCTYPE html>
<html lang="en">
<head>

    }

    }
</style>

<body>

    <table border="1">

            </tr>
        </thead>

    <tbody>
  
    <tr>
        <td>{{member.name}}</td>
        <td>{{member.member_id}}</td>
        <td>{{member.member_pw}}</td>

    </tr>

    </table>

</html>
